version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: youtube-share-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - youtube-share-network

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: youtube-share-backend
    command: pnpm run dev
    volumes:
      - ./src/backend:/app
      - /app/node_modules
    env_file: .env.dev
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://localhost:5000/api/v1/health", (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on("error", () => process.exit(1))']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - youtube-share-network

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: builder
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    container_name: youtube-share-frontend
    command: pnpm run dev --host 0.0.0.0 --port 80
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_WS_URL=${VITE_WS_URL}
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://localhost:80", (r) => process.exit(r.statusCode ? 0 : 1)).on("error", () => process.exit(1))']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - youtube-share-network

  postgres:
    image: postgres:16-alpine
    container_name: youtube-share-postgres
    env_file: .env.dev
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - youtube-share-network

  redis:
    image: redis:7-alpine
    container_name: youtube-share-redis
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - youtube-share-network

volumes:
  postgres_data:
  redis_data:

networks:
  youtube-share-network:
    driver: bridge
