services:
  youtube-sharing-postgres:
    image: postgres:16-alpine
    container_name: youtube-sharing-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-network
    tmpfs:
      - /var/lib/postgresql/data
    command: >
      sh -c "
        cp /scripts/init-postgres.sh /tmp/init.sh && chmod +x /tmp/init.sh && gosu postgres /tmp/init.sh &
        exec docker-entrypoint.sh postgres
      "
    volumes:
      - ./scripts/init-postgres.sh:/scripts/init-postgres.sh:ro

  youtube-sharing-redis:
    image: redis:7-alpine
    container_name: youtube-sharing-redis
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-network
    tmpfs:
      - /data

  youtube-sharing-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-sharing-backend
    env_file:
      - .env
    working_dir: /app
    command: pnpm dev
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_HOST: youtube-sharing-postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: youtube-sharing-redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - '5000:5000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      youtube-sharing-postgres:
        condition: service_healthy
      youtube-sharing-redis:
        condition: service_healthy
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
