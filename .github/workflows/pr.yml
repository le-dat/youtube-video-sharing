name: Pull Request Check

on:
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Check formatting & Lint
        run: |
          pnpm run lint
          pnpm run format

      - name: Run Unit Tests
        run: pnpm run test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Type check and Build
        run: pnpm run build
        
  docker-dry-run:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Dry-run Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          push: false
          tags: backend-test:latest
          
      - name: Dry-run Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          push: false
          tags: frontend-test:latest
          build-args: |
            VITE_API_URL=http://localhost/api/v1
            VITE_WS_URL=http://localhost/events
