name: Deploy to VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=https://youtube-sharing.duckdns.org/api/v1
            VITE_WS_URL=https://youtube-sharing.duckdns.org/events

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          envs: GHCR_PAT
          script: |
            set -e
            
            # Login to GitHub Container Registry using the ephemeral token
            echo $GHCR_PAT | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            cd /home/moltbot/server/youtube-sharing-nestjs
            git fetch origin
            git pull origin main
            
            # Auto-migrate .env to .env.prod if needed
            if [ ! -f .env.prod ] && [ -f .env ]; then
              cp .env .env.prod
            fi
            
            # Pull the latest built images from GHCR
            docker compose -f docker-compose.prod.yml pull
            
            # Stop old containers to prevent name conflicts (especially useful when migrating from v1 to v2)
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            
            # Restart containers with the newly pulled images
            docker compose -f docker-compose.prod.yml up -d
            
            # Clean up old images to free up disk space
            docker image prune -af
