version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: youtube-share-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - youtube-share-network
      - npm_network

  backend:
    image: ghcr.io/le-dat/youtube-video-sharing-backend:latest
    container_name: youtube-share-backend
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - youtube-share-network

  frontend:
    image: ghcr.io/le-dat/youtube-video-sharing-frontend:latest
    container_name: youtube-share-frontend
    restart: unless-stopped
    networks:
      - youtube-share-network

  postgres:
    image: postgres:16-alpine
    container_name: youtube-share-postgres
    env_file: .env.prod
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - youtube-share-network

  redis:
    image: redis:7-alpine
    container_name: youtube-share-redis
    volumes:
      - redis_data:/data
    # ports:
    #   - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - youtube-share-network
      - npm_network 

volumes:
  postgres_data:
  redis_data:

networks:
  youtube-share-network:
    driver: bridge
  npm_network:        
    external: true
